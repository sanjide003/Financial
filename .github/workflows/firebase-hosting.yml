name: Firebase Hosting Deploy

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Firebase hosting channel (preview or live)'
        required: true
        default: 'preview'
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Deploy preview channel
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.channel != 'live'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: '${{ github.event.inputs.channel }}'
      - name: Deploy live hosting
        if: github.event_name == 'push' || github.event.inputs.channel == 'live'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          channelId: live
